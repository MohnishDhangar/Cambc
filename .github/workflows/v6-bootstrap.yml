name: Materialize Bot6 v6.1 executor from frozen v4
on:
  push:
    branches: [develop/v6-macro-v0]
    paths:
      - tools/bootstrap_bot6_v4_executor.py
      - .github/workflows/v6-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct audited six-file Bot6 v6.1 source
        run: |
          python3 tools/bootstrap_bot6_v4_executor.py
          python3 tools/bootstrap_bot6_v4_executor.py --check
          sha256sum bots/Bot6/src/*.cpp bots/Bot6/src/*.h
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bots/Bot6/src
          if ! git diff --cached --quiet; then
            git commit -m 'v6.1: use frozen v4 executor with tunable macro objective scoring'
            git fetch origin develop/v6-macro-v0
            git rebase origin/develop/v6-macro-v0
            git push origin HEAD:develop/v6-macro-v0
          fi
