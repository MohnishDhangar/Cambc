name: Package v6.8 and v6.9 field source archives
on:
  push:
    branches: [develop/v6.9-adaptive-bank-distance]
    paths: ['.github/workflows/package-v6-field-zips.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package CAMBC compatible source archives
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile, hashlib, json
          p = pathlib.Path("releases")
          p.mkdir(exist_ok=True)
          files = ["bot.cpp", "bot.h", "draft.cpp", "draft.h", "main.cpp", "random.h"]
          revisions = {
              "v6.8": "0ddd5338b94db824f9f53261a17f020490b7017f",
              "v6.9-experimental": "2f4e25a4a76244ac85d79297a38af5883921dfaa",
          }
          report = {}
          for label, rev in revisions.items():
              archive = p / ("Bot6-" + label + "-sources.zip")
              source_hashes = {}
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as z:
                  for name in files:
                      payload = subprocess.check_output(["git", "show", rev + ":bots/Bot6/src/" + name])
                      entry = "src/" + name
                      z.writestr(entry, payload)
                      source_hashes[entry] = hashlib.sha256(payload).hexdigest()
              with zipfile.ZipFile(archive) as z:
                  assert sorted(z.namelist()) == sorted("src/" + name for name in files)
                  assert z.testzip() is None
                  for name in files:
                      expected = subprocess.check_output(["git", "show", rev + ":bots/Bot6/src/" + name])
                      assert z.read("src/" + name) == expected
                  assert "src/main.cpp" in z.namelist()
              report[label] = {
                  "commit": rev, "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
                  "entries": sorted(source_hashes), "source_sha256": source_hashes,
                  "cambc_layout": "src/*.cpp and src/*.h",
              }
              print("Verified", archive, report[label]["sha256"])
          (p / "field-zips-manifest.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v6.8-v6.9-cambc-source-zips
          path: releases/
      - name: Commit verified archives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/
          if ! git diff --cached --quiet; then
            git commit -m 'fix(release): package bot sources inside src/ for CAMBC import'
            git fetch origin develop/v6.9-adaptive-bank-distance
            git rebase origin/develop/v6.9-adaptive-bank-distance
            git push origin HEAD:develop/v6.9-adaptive-bank-distance
          fi
