name: CAMBC v6.16 and v6.17 experimental C++ source ZIPs
on:
  push:
    branches: [field/v6.16-v6.17-candidate-kit]
    paths: ['.github/workflows/package-v6.16-v6.17.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create src-folder CAMBC ZIP packages with pinned source
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          directory=pathlib.Path('field-kits');directory.mkdir(exist_ok=True)
          files=('bot.cpp','bot.h','draft.cpp','draft.h','main.cpp','random.h')
          commits={
            'v6.16':'3d611d14a27863e50fe4fc32269b53127851dfc5',
            'v6.17-experimental':'8d3193b34c100c2cc9d64d23f24c8132690f76a6',
          }
          manifest={}
          for label,revision in commits.items():
            path=directory/('Bot6-'+label+'-CAMBC.zip')
            sources={}
            with zipfile.ZipFile(path,'w',compression=zipfile.ZIP_DEFLATED) as out:
              for name in files:
                data=subprocess.check_output(['git','show',revision+':bots/Bot6/src/'+name])
                out.writestr('src/'+name,data)
                sources['src/'+name]=hashlib.sha256(data).hexdigest()
            with zipfile.ZipFile(path) as out:
              assert sorted(out.namelist())==sorted(sources)
              assert out.testzip() is None
              assert out.read('src/main.cpp')
            manifest[label]={'source_commit':revision,
              'zip_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
              'entry_sha256':sources,'CAMBC_layout':'src/*.cpp and src/*.h'}
            print(label,path,manifest[label]['zip_sha256'])
          (directory/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CAMBC-v6.16-v6.17-experimental-zips
          path: field-kits/
          retention-days: 90
      - name: Commit pinned packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add field-kits/
          if ! git diff --cached --quiet; then
            git commit -m 'field: package v6.16 and v6.17 experimental upload ZIPs'
            git fetch origin field/v6.16-v6.17-candidate-kit
            git rebase origin/field/v6.16-v6.17-candidate-kit
            git push origin HEAD:field/v6.16-v6.17-candidate-kit
          fi
