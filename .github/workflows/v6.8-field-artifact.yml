name: Build pinned v6.8 field-test WASM
on:
  push:
    branches: [field/v6.8-pinned-wasm]
    paths: ['.github/workflows/v6.8-field-artifact.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable v6.8 source
        uses: actions/checkout@v4
      - name: Check pinned C++ source hash
        run: |
          printf '%s  %s\n' f74745b290dd9c2f9b6a6b46a1128d031ae080d5d9b024993a7b554198c5e7ac bots/Bot6/src/bot.cpp | sha256sum --check
      - name: Install CAMBC SDK 3.0.1
        run: |
          python3 -m pip install --user 'cambc==3.0.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile official release WASM
        env:
          CAMBC_NO_UPDATE_CHECK: '1'
        run: |
          cambc --version
          CAMBC_OFFLINE=1 cambc init --yes .
          cambc build Bot6 --release --output "$RUNNER_TEMP/Bot6-v6.8-CAMBC3.0.1.wasm"
          test -s "$RUNNER_TEMP/Bot6-v6.8-CAMBC3.0.1.wasm"
          sha256sum "$RUNNER_TEMP/Bot6-v6.8-CAMBC3.0.1.wasm"
      - name: Create reproducible source package and manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"])
          src = Path("bots/Bot6/src")
          names = ("bot.cpp", "bot.h", "draft.cpp", "draft.h", "main.cpp", "random.h")
          with zipfile.ZipFile(out/"Bot6-v6.8-source.zip", "w", compression=zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  z.write(src/name, arcname=name)
          wasm = out/"Bot6-v6.8-CAMBC3.0.1.wasm"
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          record = dict(version="v6.8", engine="CAMBC 3.0.1",
              pinned_source_commit="0ddd5338b94db824f9f53261a17f020490b7017f",
              source_sha256={name: digest(src/name) for name in names},
              wasm_sha256=digest(wasm),
              known_training_result="21 wins / 34 vs frozen v4; 52 fuel spills; not a dominant or fault-free release",
              held_out_maps_unseen=["00lanes","01corridors","01hooks","01islands"])
          (out/"Bot6-v6.8-manifest.json").write_text(json.dumps(record, indent=2)+"\n")
          PY
      - name: Upload field-test WASM and source kit
        uses: actions/upload-artifact@v4
        with:
          name: Bot6-v6.8-field-kit
          path: |
            ${{ runner.temp }}/Bot6-v6.8-CAMBC3.0.1.wasm
            ${{ runner.temp }}/Bot6-v6.8-source.zip
            ${{ runner.temp }}/Bot6-v6.8-manifest.json
          retention-days: 60
