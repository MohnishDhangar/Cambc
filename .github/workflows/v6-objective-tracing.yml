name: CAMBC permitted objective-map action tracing
on:
  push:
    branches: [research/v6-objective-action-tracing]
    paths: ['tools/profile_v6_objectives.py', '.github/workflows/v6-objective-tracing.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SDK 3.0.1
        run: |
          python3 -m pip install --user 'cambc==3.0.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Initialize local runner
        env:
          CAMBC_NO_UPDATE_CHECK: '1'
        run: |
          CAMBC_OFFLINE=1 cambc init --yes .
          cambc --version
          cambc build Bot6 --release
      - name: Build and trace pinned bots
        run: python3 tools/profile_v6_objectives.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-objective-action-traces
          path: match-data/analysis/v6-objective-traces/summary.json
      - name: Commit verified trace report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add match-data/analysis/v6-objective-traces/summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: trace v6 objective-map actions on permitted maps'
            git fetch origin research/v6-objective-action-tracing
            git rebase origin/research/v6-objective-action-tracing
            git push origin HEAD:research/v6-objective-action-tracing
          fi
