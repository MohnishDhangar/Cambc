name: V6.9 distance-aware banking paired tournament
on:
  push:
    branches: [develop/v6.9-adaptive-bank-distance]
    paths:
      - 'bots/Bot6/src/**'
      - 'tools/benchmark_v6_9_adaptive_bank.py'
      - '.github/workflows/v6.9-adaptive-bank.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install current CAMBC
        run: |
          python3 -m pip install --user 'cambc==3.0.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Provision CAMBC SDK and WASI
        env:
          CAMBC_NO_UPDATE_CHECK: '1'
        run: |
          cambc --version
          CAMBC_OFFLINE=1 cambc init --yes .
          cambc build Bot6 --release
      - name: Build candidates and conduct 102 paired training games
        run: python3 tools/benchmark_v6_9_adaptive_bank.py
      - name: Archive experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-9-adaptive-bank-evidence
          path: |
            match-data/analysis/v6.9-adaptive-bank/games.csv
            match-data/analysis/v6.9-adaptive-bank/summary.json
          retention-days: 60
      - name: Publish verified experiment results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add match-data/analysis/v6.9-adaptive-bank/games.csv match-data/analysis/v6.9-adaptive-bank/summary.json
          if ! git diff --cached --quiet; then
            git commit -m "experiment: v6.9 adaptive banking 102-game paired results"
            git fetch origin develop/v6.9-adaptive-bank-distance
            git rebase origin/develop/v6.9-adaptive-bank-distance
            git push origin HEAD:develop/v6.9-adaptive-bank-distance
          fi
